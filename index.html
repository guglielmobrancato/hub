<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marte Hub | Ecosystem Nexus</title>
    <meta name="description" content="Il punto di accesso all'ecosistema Marte Studios.">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VTHQ6Z8WC8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VTHQ6Z8WC8'); 
    </script>

    <style>
        :root {
            --bg: #050202;
            --marte-orange: #ff5500;
            --text: #ffffff;
            --text-dim: #ffccb3;
            --glass: rgba(20, 10, 10, 0.7);
            --border: rgba(255, 85, 0, 0.4);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* SFONDO MARZIANO (FIXATO) */
        .planet-bg {
            position: fixed; /* Fisso sullo schermo */
            top: 0; left: 0; width: 100%; height: 100%;
            /* Nuova immagine Marte più luminosa */
            background-image: url('https://images.unsplash.com/photo-1614728853975-69c960f7274f?q=80&w=1920');
            background-size: cover;
            background-position: center;
            z-index: 0; /* Livello base */
        }
        
        /* Overlay per scurire leggermente e rendere leggibile il testo */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%);
            z-index: 1; /* Sopra l'immagine */
            pointer-events: none;
        }

        /* CONTENUTO (Sopra tutto) */
        .content-wrapper {
            position: relative;
            z-index: 2; /* Sopra sfondo e overlay */
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* TITOLO HUB */
        .hub-title {
            text-align: center;
            margin: 4rem 0 3rem 0;
            padding: 0 20px;
        }
        .hub-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            margin: 0;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff 0%, var(--marte-orange) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 85, 0, 0.8); /* Glow più forte */
            line-height: 1;
        }
        .hub-title p {
            font-size: 1.1rem;
            letter-spacing: 6px;
            color: var(--marte-orange);
            margin-top: 10px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* GRIGLIA PORTALI */
        .portal-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 1.5rem;
            max-width: 800px;
            width: 90%;
            margin-bottom: 4rem;
        }

        /* CARD DEL SITO */
        .portal-card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 1.8rem;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            min-height: 100px;
        }

        /* Effetto Hover Arancione */
        .portal-card:hover {
            transform: translateY(-5px);
            border-color: var(--marte-orange);
            background: rgba(40, 20, 20, 0.9);
            box-shadow: 0 0 25px rgba(255, 85, 0, 0.4);
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card-title { font-family: 'Orbitron'; font-size: 1.3rem; margin: 0; text-transform: uppercase; font-weight: bold; }
        .card-icon { color: var(--marte-orange); font-size: 1.2rem; transition: 0.3s; }
        .portal-card:hover .card-icon { transform: scale(1.2); text-shadow: 0 0 10px var(--marte-orange); }
        
        .card-desc { 
            font-size: 0.85rem; 
            color: var(--text-dim); 
            font-weight: 300; 
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        /* FOOTER */
        .system-status {
            margin-bottom: 20px;
            font-size: 0.7rem; color: #aaa; letter-spacing: 2px;
            text-transform: uppercase;
        }
        .system-status span { color: var(--marte-orange); }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 1024px) {
            .portal-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .hub-title h1 { font-size: 2.5rem; letter-spacing: 4px; }
            .portal-grid { grid-template-columns: 1fr; gap: 1rem; }
            .portal-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="planet-bg"></div>
    <div class="overlay"></div>

    <div class="content-wrapper">
        
        <div class="hub-title">
            <h1>Marte Hub</h1>
            <p>System Nexus</p>
        </div>

        <div class="portal-grid">
            
            <a href="https://ilsottobosco.martestudios.com" class="portal-card" onclick="trackClick('Sottobosco')">
                <div class="card-header">
                    <div class="card-title">Sottobosco</div>
                    <i class="fas fa-microphone-alt card-icon"></i>
                </div>
                <div class="card-desc">Podcast & Cultural Roots</div>
            </a>

            <a href="https://velvet.martestudios.com" class="portal-card" onclick="trackClick('Velvet')">
                <div class="card-header">
                    <div class="card-title">Velvet</div>
                    <i class="fas fa-record-vinyl card-icon"></i>
                </div>
                <div class="card-desc">Cinema & Sound Magazine</div>
            </a>

            <a href="https://mff.martestudios.com" class="portal-card" onclick="trackClick('MFF')">
                <div class="card-header">
                    <div class="card-title">MFF</div>
                    <i class="fas fa-ticket-alt card-icon"></i>
                </div>
                <div class="card-desc">Marte Film Festival & Awards</div>
            </a>

            <a href="https://martestudios.com" class="portal-card" onclick="trackClick('Studios')">
                <div class="card-header">
                    <div class="card-title">Studios</div>
                    <i class="fas fa-video card-icon"></i>
                </div>
                <div class="card-desc">Corporate & Production House</div>
            </a>

        </div>

        <div class="system-status">
            Location: <span>Orbit</span> • Analytics: <span>Active</span>
        </div>
    </div>

    <script>
        function trackClick(destination) {
            gtag('event', 'hub_exit_click', {
                'event_category': 'Navigation',
                'event_label': destination,
                'transport_type': 'beacon'
            });
        }
    </script>

</body>
</html>
