<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marte Hub | Ecosystem Nexus</title>
    <meta name="description" content="Il punto di accesso all'ecosistema Marte Studios.">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VTHQ6Z8WC8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-VTHQ6Z8WC8'); 
    </script>

    <style>
        :root {
            --bg: #050202;
            --marte-orange: #ff5500;
            --marte-rust: #8a2be2; 
            --text: #ffffff;
            --text-dim: #ffccb3;
            --glass: rgba(20, 10, 10, 0.6);
            --border: rgba(255, 85, 0, 0.3);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* SFONDO MARZIANO */
        .planet-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            /* Immagine di Marte dallo spazio */
            background-image: url('https://images.unsplash.com/photo-1614728853975-69c960f7274f?q=80&w=1920');
            background-size: cover;
            background-position: center;
            z-index: 0;
            filter: brightness(0.6) contrast(1.1);
        }
        
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, #000 90%);
            z-index: 1;
            pointer-events: none;
        }

        /* TITOLO HUB */
        .hub-title {
            text-align: center;
            margin-bottom: 3rem;
            z-index: 10;
            position: relative;
        }
        .hub-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            margin: 0;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff 0%, var(--marte-orange) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 85, 0, 0.6);
        }
        .hub-title p {
            font-size: 1.1rem;
            letter-spacing: 6px;
            color: var(--marte-orange);
            margin-top: 5px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* GRIGLIA PORTALI */
        .portal-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            max-width: 900px;
            width: 90%;
            z-index: 10;
        }

        /* CARD DEL SITO */
        .portal-card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .portal-card::after {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 85, 0, 0.2), transparent);
            transform: translateX(-100%);
            transition: 0.5s;
        }

        .portal-card:hover {
            transform: translateY(-5px);
            border-color: var(--marte-orange);
            box-shadow: 0 0 25px rgba(255, 85, 0, 0.3), inset 0 0 10px rgba(255, 85, 0, 0.1);
        }

        .portal-card:hover::after { transform: translateX(100%); }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card-title { font-family: 'Orbitron'; font-size: 1.4rem; margin: 0; text-transform: uppercase; font-weight: bold; }
        .card-icon { color: var(--marte-orange); font-size: 1.2rem; }
        
        .card-desc { 
            font-size: 0.9rem; 
            color: var(--text-dim); 
            font-weight: 300; 
            letter-spacing: 1px;
        }

        /* FOOTER */
        .system-status {
            position: absolute; bottom: 20px;
            font-size: 0.7rem; color: #664444; letter-spacing: 2px;
            z-index: 10;
            text-transform: uppercase;
        }
        .system-status span { color: var(--marte-orange); }

        @media (max-width: 768px) {
            .portal-grid { grid-template-columns: 1fr; }
            .hub-title h1 { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

    <div class="planet-bg"></div>
    <div class="overlay"></div>

    <div class="hub-title">
        <h1>Marte Hub</h1>
        <p>System Nexus</p>
    </div>

    <div class="portal-grid">
        
        <a href="https://msh.martestudios.com" class="portal-card" onclick="trackClick('MSH')">
            <div class="card-header">
                <div class="card-title">MSH</div>
                <i class="fas fa-globe-americas card-icon"></i>
            </div>
            <div class="card-desc">Intelligence & Geopolitical News</div>
        </a>

        <a href="https://ilsottobosco.martestudios.com" class="portal-card" onclick="trackClick('Sottobosco')">
            <div class="card-header">
                <div class="card-title">Sottobosco</div>
                <i class="fas fa-microphone-alt card-icon"></i>
            </div>
            <div class="card-desc">Podcast & Cultural Roots</div>
        </a>

        <a href="https://velvet.martestudios.com" class="portal-card" onclick="trackClick('Velvet')">
            <div class="card-header">
                <div class="card-title">Velvet</div>
                <i class="fas fa-record-vinyl card-icon"></i>
            </div>
            <div class="card-desc">Cinema & Sound Magazine</div>
        </a>

        <a href="https://martestudios.com" class="portal-card" onclick="trackClick('Studios')">
            <div class="card-header">
                <div class="card-title">Studios</div>
                <i class="fas fa-video card-icon"></i>
            </div>
            <div class="card-desc">Corporate & Production</div>
        </a>

    </div>

    <div class="system-status">
        Location: <span>Orbit</span> • Analytics: <span>Active</span>
    </div>

    <script>
        function trackClick(destination) {
            gtag('event', 'hub_exit_click', {
                'event_category': 'Navigation',
                'event_label': destination,
                'transport_type': 'beacon'
            });
        }
    </script>

</body>
</html>
