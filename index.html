    <style>
        :root {
            --bg: #050202;
            --marte-orange: #ff5500;
            --marte-rust: #8a2be2; 
            --text: #ffffff;
            --text-dim: #ffccb3;
            --glass: rgba(20, 10, 10, 0.65); /* Leggermente più opaco per leggibilità */
            --border: rgba(255, 85, 0, 0.3);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            min-height: 100vh; /* Permette lo scroll se serve */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            /* Su mobile permette lo scroll, su desktop no se ci sta tutto */
            overflow-x: hidden;
            overflow-y: auto; 
        }

        /* SFONDO MARZIANO */
        .planet-bg {
            position: fixed; /* Fisso anche se scrolli */
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1614728853975-69c960f7274f?q=80&w=1920');
            background-size: cover;
            background-position: center;
            z-index: -2;
            filter: brightness(0.6) contrast(1.1);
        }
        
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, #000 90%);
            z-index: -1;
            pointer-events: none;
        }

        /* TITOLO HUB */
        .hub-title {
            text-align: center;
            margin: 4rem 0 3rem 0; /* Margine superiore per mobile */
            z-index: 10;
            position: relative;
            padding: 0 20px;
        }
        .hub-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            margin: 0;
            letter-spacing: 8px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff 0%, var(--marte-orange) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 85, 0, 0.6);
            line-height: 1;
        }
        .hub-title p {
            font-size: 1.1rem;
            letter-spacing: 6px;
            color: var(--marte-orange);
            margin-top: 10px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* GRIGLIA PORTALI OTTIMIZZATA */
        .portal-grid {
            display: grid;
            /* Desktop: 3 Colonne per 6 elementi */
            grid-template-columns: repeat(3, 1fr); 
            gap: 1.5rem;
            max-width: 1200px;
            width: 90%;
            z-index: 10;
            margin-bottom: 4rem; /* Spazio per il footer */
        }

        /* CARD DEL SITO */
        .portal-card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 1.8rem;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            min-height: 100px; /* Altezza minima uniforme */
        }

        /* Effetto Scanline Arancione */
        .portal-card::after {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 85, 0, 0.2), transparent);
            transform: translateX(-100%);
            transition: 0.5s;
        }

        .portal-card:hover {
            transform: translateY(-5px);
            border-color: var(--marte-orange);
            box-shadow: 0 0 25px rgba(255, 85, 0, 0.3), inset 0 0 10px rgba(255, 85, 0, 0.1);
        }

        .portal-card:hover::after { transform: translateX(100%); }
